<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ARO — Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --crudo:#F2E9D8; --crudo-deep:#E4D4B8; --crudo-line:#DCCBA8;
    --negro:#1B1712; --negro-soft:#5c5347;
    --vino:#5A1420; --vino-deep:#3C0D15; --vino-soft:rgba(90,20,32,0.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:#fff;color:var(--vino);}
  #app{max-width:600px;margin:0 auto;min-height:100vh;background:#fff;}
  #splash{
    position:fixed;inset:0;background:#fff;z-index:200;
    display:flex;align-items:center;justify-content:center;
    transition:opacity 0.5s ease;
  }
  #splash.hide{opacity:0;pointer-events:none;}
  #splash .mark{width:110px;color:var(--vino);animation:aro-pulse 1.5s ease-in-out infinite;}
  #splash .mark svg{display:block;width:100%;height:auto;}
  @keyframes aro-pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}

  .cat-bar{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 4px;-webkit-overflow-scrolling:touch;}
  .announce-bar{
    background:var(--vino);color:var(--crudo);text-align:center;
    padding:9px 16px;font-size:11.5px;font-weight:600;letter-spacing:0.03em;
    position:sticky;top:0;z-index:60;font-family:'Oswald',sans-serif;
    text-transform:uppercase;
  }
  #announce-text{display:inline-block;transition:opacity 0.35s ease;}
  #announce-text.fade{opacity:0;}
  .cat-bar::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;padding:8px 16px;border-radius:20px;border:1.5px solid var(--crudo-line);
    background:#fff;font-size:12px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;
    color:var(--vino);cursor:pointer;white-space:nowrap;font-family:'Oswald',sans-serif;
  }
  .cat-chip.active{background:var(--vino);border-color:var(--vino);color:var(--crudo);}

  main{padding:18px 16px 100px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;}
  .card{background:none;cursor:pointer;transition:transform 0.15s ease;}
  .card:active{transform:scale(0.97);}
  .card .info .brand{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--vino-soft);margin-bottom:2px;display:block;font-family:'Oswald',sans-serif;}
  .card .thumb{aspect-ratio:3/4;border-radius:20px;background:#f4efe6;display:flex;align-items:center;
    justify-content:center;color:var(--vino-soft);overflow:hidden;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;border-radius:20px;}
  .card .thumb svg{width:30%;opacity:0.4;}
  .card .info{padding:10px 2px 0;}
  .card .info b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;font-family:'Oswald',sans-serif;
    letter-spacing:0.01em;color:var(--vino-soft);}
  .card .info .price{color:var(--vino-soft);font-weight:700;margin-top:3px;font-size:14px;font-family:'Oswald',sans-serif;}
  .card .info .variants{font-size:11px;color:var(--vino-soft);opacity:0.75;margin-top:2px;}
  .card.out{opacity:0.45;}
  .empty{text-align:center;padding:60px 20px;color:var(--vino-soft);}
  .empty .mark{width:70px;margin:0 auto 16px;opacity:0.3;}
  .empty .mark svg{display:block;width:100%;height:auto;}

  .cart-fab{
    position:fixed;bottom:20px;right:20px;background:var(--vino);color:var(--crudo);
    border-radius:30px;padding:13px 20px;font-weight:600;font-size:14px;display:flex;
    align-items:center;gap:8px;box-shadow:0 6px 20px rgba(60,13,21,0.35);z-index:30;border:none;cursor:pointer;
    font-family:'Oswald',sans-serif;
  }
  .cart-fab .badge{background:var(--crudo);color:var(--vino);border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .cart-fab.hidden{display:none;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(27,23,18,0.6);display:none;
    align-items:flex-end;justify-content:center;z-index:60;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:#fff;width:100%;max-width:600px;border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;
    position:relative;
  }
  .modal h3{margin:0 0 4px;font-size:19px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.01em;color:var(--vino-soft);}
  .close-x{position:absolute;top:14px;right:14px;background:var(--crudo-deep);border:none;
    width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--negro);}
  .variant-row{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--crudo-line);
    border-radius:10px;margin-bottom:8px;background:#fff;cursor:pointer;}
  .variant-row.out{opacity:0.4;pointer-events:none;}
  .variant-row .vinfo{flex:1;}
  .variant-row .vinfo b{display:block;font-size:13.5px;font-family:'Oswald',sans-serif;}
  .variant-row .vinfo span{font-size:11.5px;color:var(--vino-soft);}
  .variant-row .vprice{font-weight:700;color:var(--vino);font-size:13.5px;}

  .cart-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--crudo-line);}
  .cart-item .ci-info{flex:1;}
  .cart-item .ci-info b{display:block;font-size:13.5px;font-family:'Oswald',sans-serif;}
  .cart-item .ci-info span{font-size:12px;color:var(--vino-soft);}
  .cart-item .ci-qty{display:flex;align-items:center;gap:6px;}
  .cart-item .ci-qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--crudo-line);
    background:#fff;font-size:14px;cursor:pointer;}
  .cart-total{display:flex;justify-content:space-between;padding:14px 0;font-weight:700;font-size:16px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--vino-soft);}
  .field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--crudo-line);
    font-size:15px;font-family:inherit;background:#fff;}

  .btn{border:none;border-radius:12px;padding:14px;font-weight:600;font-size:15px;cursor:pointer;
    font-family:'Oswald',sans-serif;letter-spacing:0.02em;width:100%;}
  .btn-primary{background:var(--vino);color:var(--crudo);}
  .btn-primary:disabled{opacity:0.5;}
  .btn-outline{background:none;border:1.5px solid var(--crudo-line);color:var(--negro);margin-top:8px;}

  .status-banner{padding:14px 16px;border-radius:12px;margin-bottom:16px;font-size:13.5px;font-weight:600;text-align:center;}
  .status-banner.ok{background:#DCEEDC;color:#2C5F2D;}
  .status-banner.fail{background:#F3D9D9;color:#7A2020;}
  .status-banner.pending{background:#F3EAD0;color:#7A5A20;}

  .checkout-error{color:#a63333;font-size:12.5px;margin-top:-6px;margin-bottom:12px;}

  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  .ship-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:13px 14px;border:1.5px solid var(--crudo-line);border-radius:12px;margin-bottom:8px;
    cursor:pointer;background:#fff;}
  .ship-opt.selected{border-color:var(--vino);background:#faf1e7;}
  .ship-opt b{font-size:13.5px;display:block;font-family:'Oswald',sans-serif;}
  .ship-opt span{font-size:11.5px;color:var(--vino-soft);}
  .ship-opt .sp-price{font-weight:700;color:var(--vino);font-size:13.5px;white-space:nowrap;}

  .chip-group{margin-bottom:16px;}
  .chip-group-label{font-size:12px;font-weight:600;color:var(--vino-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:9px 16px;border-radius:20px;border:1.5px solid var(--crudo-line);
    background:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Oswald',sans-serif;}
  .chip.selected{border-color:var(--vino);background:var(--vino);color:var(--crudo);}
  .variant-summary{font-size:13px;color:var(--vino-soft);margin:4px 0 16px;min-height:18px;font-family:'Oswald',sans-serif;}
  .variant-photo{
    aspect-ratio:3/4;border-radius:16px;background:#f4efe6;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:var(--vino-soft);
    margin-bottom:14px;max-height:260px;
  }
  .variant-photo img{width:100%;height:100%;object-fit:cover;}
  .variant-photo svg{width:26%;opacity:0.4;}
</style>
</head>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://ebkzbcskwycmrlrtqkla.supabase.co";
  var SUPABASE_KEY = "sb_publishable_FqcMg8-PAjPl09wmCJCEjw_HZ_iVppg";
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var THUMB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

  var products = [];
  var cart = []; // {code, name, price, qty, photo}

  function money(n){ return "$" + Math.round(Number(n) || 0).toLocaleString('es-MX'); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(m){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
    });
  }
  function deriveBaseCode(code){
    code = (code || "").trim();
    return code.indexOf('-') > -1 ? code.split('-')[0] : code;
  }

  function hideSplash(){
    var el = document.getElementById('splash');
    if(!el) return;
    el.classList.add('hide');
    setTimeout(function(){ el.remove(); }, 500);
  }

  async function loadProducts(){
    var minWait = new Promise(function(resolve){ setTimeout(resolve, 700); });
    try{
      var res = await supabase.from('products').select('*').gt('stock_local', 0);
      if(res.error){ document.getElementById('grid').innerHTML = '<p>No se pudo cargar el catálogo.</p>'; await minWait; hideSplash(); return; }
      products = res.data.map(function(row){
        return {
          code: row.code,
          baseCode: row.base_code || deriveBaseCode(row.code),
          name: row.name,
          color: row.color || "",
          talla: row.talla || "",
          price: Number(row.price) || 0,
          category: row.category || "",
          photo: row.photo || null,
          stock: Number(row.stock_local) || 0
        };
      });
      renderCategoryFilter();
      renderGrid();
      await minWait;
      hideSplash();
    }catch(e){
      document.getElementById('grid').innerHTML = '<p>No se pudo conectar con la tienda.</p>';
      await minWait;
      hideSplash();
    }
  }

  var currentCategory = 'Todo';

  function renderCategoryFilter(){
    var cats = uniq(products.map(function(p){ return p.category; }).filter(Boolean));
    var bar = document.getElementById('cat-bar');
    if(cats.length === 0){ bar.innerHTML = ''; return; }
    var all = ['Todo'].concat(cats);
    bar.innerHTML = all.map(function(c){
      return '<button type="button" class="cat-chip ' + (c === currentCategory ? 'active' : '') + '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
    }).join('');
    bar.querySelectorAll('.cat-chip').forEach(function(el){
      el.addEventListener('click', function(){
        currentCategory = el.dataset.cat;
        renderCategoryFilter();
        renderGrid();
      });
    });
  }

  function renderGrid(){
    var grid = document.getElementById('grid');
    var visible = currentCategory === 'Todo' ? products : products.filter(function(p){ return p.category === currentCategory; });
    if(products.length === 0){
      grid.outerHTML = '<div class="empty"><div class="mark">' + logoSvgOnly() + '</div><p>Por ahora no hay productos disponibles.</p></div>';
      return;
    }
    if(visible.length === 0){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1;"><p>Sin productos en esta categoría.</p></div>';
      return;
    }
    var seen = {};
    var groups = [];
    visible.forEach(function(p){
      if(seen[p.baseCode]) return;
      seen[p.baseCode] = true;
      var variants = products.filter(function(x){ return x.baseCode === p.baseCode; });
      groups.push({ baseCode: p.baseCode, sample: p, variants: variants });
    });

    grid.innerHTML = groups.map(function(g){
      var totalStock = g.variants.reduce(function(a,v){ return a + v.stock; }, 0);
      var photo = g.variants.find(function(v){ return v.photo; });
      var thumb = photo ? '<img src="' + photo.photo + '" style="width:100%;height:100%;object-fit:cover;">' : THUMB_ICON;
      return '<div class="card" data-basecode="' + escapeHtml(g.baseCode) + '">' +
        '<div class="thumb">' + thumb + '</div>' +
        '<div class="info"><b>' + escapeHtml(g.sample.name) + '</b>' +
        '<div class="price">' + money(g.sample.price) + '</div>' +
        (g.variants.length > 1 ? '<div class="variants">' + g.variants.length + ' variantes</div>' : '') +
        '</div></div>';
    }).join('');

    grid.querySelectorAll('.card').forEach(function(el){
      el.addEventListener('click', function(){ openVariantPicker(el.dataset.basecode); });
    });
  }

  function logoSvgOnly(){
    var el = document.querySelector('#splash .mark');
    return el ? el.innerHTML : '';
  }

  // ---------- SELECTOR DE VARIANTES CON CHIPS ----------
  var variantState = { color: null, talla: null };

  function uniq(arr){
    var seen = {}, out = [];
    arr.forEach(function(x){ if(!seen[x]){ seen[x] = true; out.push(x); } });
    return out;
  }

  function openVariantPicker(baseCode){
    var group = products.filter(function(p){ return p.baseCode === baseCode; });
    if(group.length === 0) return;
    variantState = { color: null, talla: null };
    document.getElementById('variant-modal-title').textContent = group[0].name;

    var colors = uniq(group.map(function(p){ return p.color; }).filter(Boolean));
    var tallas = uniq(group.map(function(p){ return p.talla; }).filter(Boolean));

    var html = '';
    if(colors.length){
      html += '<div class="chip-group"><div class="chip-group-label">Color</div><div class="chip-row" id="color-chips">' +
        colors.map(function(c){ return '<button type="button" class="chip" data-color="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>'; }).join('') +
        '</div></div>';
    }
    if(tallas.length){
      html += '<div class="chip-group"><div class="chip-group-label">Talla</div><div class="chip-row" id="talla-chips">' +
        tallas.map(function(t){ return '<button type="button" class="chip" data-talla="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>'; }).join('') +
        '</div></div>';
    }
    document.getElementById('variant-chips').innerHTML = html;

    if(colors.length === 1) variantState.color = colors[0];
    if(tallas.length === 1) variantState.talla = tallas[0];

    var colorEls = document.querySelectorAll('#color-chips .chip');
    var tallaEls = document.querySelectorAll('#talla-chips .chip');
    colorEls.forEach(function(el){
      el.addEventListener('click', function(){ variantState.color = el.dataset.color; refreshVariantChips(group); });
    });
    tallaEls.forEach(function(el){
      el.addEventListener('click', function(){ variantState.talla = el.dataset.talla; refreshVariantChips(group); });
    });

    refreshVariantChips(group);
    document.getElementById('variant-modal-backdrop').classList.add('show');
  }

  function updateVariantPhoto(group){
    var photoEl = document.getElementById('variant-photo');
    var candidate = null;

    if(variantState.color){
      // Prioriza una foto que corresponda al color elegido, sin importar la talla.
      candidate = group.find(function(p){ return p.color === variantState.color && p.photo; });
    }
    if(!candidate){
      // Si no hay color elegido (o ese color no tiene foto), usa la primera foto disponible del producto.
      candidate = group.find(function(p){ return p.photo; });
    }

    photoEl.innerHTML = candidate ? '<img src="' + candidate.photo + '">' : THUMB_ICON;
  }

  function refreshVariantChips(group){
    var colorGroup = document.getElementById('color-chips');
    var tallaGroup = document.getElementById('talla-chips');
    if(colorGroup){
      colorGroup.querySelectorAll('.chip').forEach(function(el){
        el.classList.toggle('selected', el.dataset.color === variantState.color);
      });
    }
    if(tallaGroup){
      tallaGroup.querySelectorAll('.chip').forEach(function(el){
        el.classList.toggle('selected', el.dataset.talla === variantState.talla);
      });
    }

    updateVariantPhoto(group);

    var summaryEl = document.getElementById('variant-summary');
    var addBtn = document.getElementById('btn-add-variant');

    if((colorGroup && !variantState.color) || (tallaGroup && !variantState.talla)){
      summaryEl.textContent = colorGroup && !variantState.color ? 'Elige un color.' : 'Elige una talla.';
      addBtn.disabled = true;
      addBtn.dataset.code = '';
      return;
    }

    var match = group.find(function(p){
      return (!colorGroup || p.color === variantState.color) && (!tallaGroup || p.talla === variantState.talla);
    });
    if(!match){
      summaryEl.innerHTML = 'Esa combinación no está disponible.';
      addBtn.disabled = true;
      addBtn.dataset.code = '';
      return;
    }
    var out = match.stock <= 0;
    summaryEl.innerHTML = '<b>' + money(match.price) + '</b>' + (out ? ' · <span style="color:#a63333;">agotado</span>' : ' · ' + match.stock + ' disponibles');
    addBtn.disabled = out;
    addBtn.textContent = out ? 'Agotado' : 'Agregar al carrito';
    addBtn.dataset.code = match.code;
  }

  document.getElementById('variant-modal-close').addEventListener('click', function(){
    document.getElementById('variant-modal-backdrop').classList.remove('show');
  });
  document.getElementById('btn-add-variant').addEventListener('click', function(){
    var code = this.dataset.code;
    if(!code) return;
    addToCart(code);
    document.getElementById('variant-modal-backdrop').classList.remove('show');
  });

  function addToCart(code){
    var p = products.find(function(x){ return x.code === code; });
    if(!p) return;
    var existing = cart.find(function(c){ return c.code === code; });
    var inCart = existing ? existing.qty : 0;
    if(inCart + 1 > p.stock){ return; }
    if(existing){ existing.qty += 1; }
    else{
      var label = [p.color, p.talla].filter(Boolean).join(' · ');
      cart.push({ code: p.code, name: label ? (p.name + ' — ' + label) : p.name, price: p.price, qty: 1 });
    }
    updateCartFab();
  }

  function updateCartFab(){
    var count = cart.reduce(function(a,c){ return a + c.qty; }, 0);
    var fab = document.getElementById('cart-fab');
    fab.classList.toggle('hidden', count === 0);
    document.getElementById('cart-count').textContent = count;
  }

  function renderCart(){
    var el = document.getElementById('cart-items');
    if(cart.length === 0){
      el.innerHTML = '<p style="text-align:center;color:var(--negro-soft);padding:20px 0;">Tu carrito está vacío.</p>';
    }else{
      el.innerHTML = cart.map(function(c, idx){
        return '<div class="cart-item">' +
          '<div class="ci-info"><b>' + escapeHtml(c.name) + '</b><span>' + money(c.price) + ' c/u</span></div>' +
          '<div class="ci-qty">' +
            '<button data-idx="' + idx + '" data-d="-1">−</button>' +
            '<span>' + c.qty + '</span>' +
            '<button data-idx="' + idx + '" data-d="1">+</button>' +
          '</div>' +
          '</div>';
      }).join('');
      el.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var idx = Number(btn.dataset.idx);
          var d = Number(btn.dataset.d);
          var item = cart[idx];
          var p = products.find(function(x){ return x.code === item.code; });
          var newQty = item.qty + d;
          if(newQty <= 0){ cart.splice(idx, 1); }
          else if(p && newQty > p.stock){ return; }
          else{ item.qty = newQty; }
          renderCart();
          updateCartFab();
        });
      });
    }
    document.getElementById('cart-total-amount').textContent = money(subtotal());
  }

  document.getElementById('cart-fab').addEventListener('click', function(){
    renderCart();
    document.getElementById('cart-modal-backdrop').classList.add('show');
  });
  document.getElementById('cart-modal-close').addEventListener('click', function(){
    document.getElementById('cart-modal-backdrop').classList.remove('show');
  });

  // ---------- ENVÍO ----------
  var SHIP_COSTS = { pickup: 0, leon: 59, nacional: 129 };
  var FREE_SHIP_THRESHOLD = 899;
  var shippingMethod = null;

  function subtotal(){ return cart.reduce(function(a,c){ return a + c.price * c.qty; }, 0); }
  function shippingCost(){
    if(!shippingMethod || shippingMethod === 'pickup') return 0;
    if(subtotal() >= FREE_SHIP_THRESHOLD) return 0;
    return SHIP_COSTS[shippingMethod] || 0;
  }
  function grandTotal(){ return subtotal() + shippingCost(); }

  function renderShippingOptions(){
    var sub = subtotal();
    var freeEligible = sub >= FREE_SHIP_THRESHOLD;
    var opts = [
      { key: 'pickup', label: 'Recoger en tienda', desc: 'Sin costo', price: 0 },
      { key: 'leon', label: 'Envío dentro de León', desc: freeEligible ? 'Gratis en compras mayores a ' + money(FREE_SHIP_THRESHOLD) : '1-2 días hábiles', price: freeEligible ? 0 : SHIP_COSTS.leon },
      { key: 'nacional', label: 'Envío nacional', desc: freeEligible ? 'Gratis en compras mayores a ' + money(FREE_SHIP_THRESHOLD) : '3-6 días hábiles', price: freeEligible ? 0 : SHIP_COSTS.nacional }
    ];
    var el = document.getElementById('shipping-options');
    el.innerHTML = opts.map(function(o){
      return '<div class="ship-opt ' + (shippingMethod === o.key ? 'selected' : '') + '" data-key="' + o.key + '">' +
        '<div><b>' + o.label + '</b><span>' + o.desc + '</span></div>' +
        '<div class="sp-price">' + (o.price === 0 ? 'Gratis' : money(o.price)) + '</div>' +
        '</div>';
    }).join('');
    el.querySelectorAll('.ship-opt').forEach(function(node){
      node.addEventListener('click', function(){
        shippingMethod = node.dataset.key;
        document.getElementById('address-fields').style.display = (shippingMethod === 'pickup') ? 'none' : 'block';
        renderShippingOptions();
        renderCheckoutTotal();
      });
    });
  }

  function renderCheckoutTotal(){
    document.getElementById('checkout-total-amount').textContent = money(grandTotal());
  }

  document.getElementById('btn-go-checkout').addEventListener('click', function(){
    if(cart.length === 0) return;
    shippingMethod = null;
    document.getElementById('address-fields').style.display = 'none';
    document.getElementById('ship-street').value = '';
    document.getElementById('ship-colonia').value = '';
    document.getElementById('ship-city').value = '';
    document.getElementById('ship-state').value = '';
    document.getElementById('ship-zip').value = '';
    document.getElementById('ship-ref').value = '';
    document.getElementById('checkout-error').textContent = '';
    renderShippingOptions();
    renderCheckoutTotal();
    document.getElementById('cart-modal-backdrop').classList.remove('show');
    document.getElementById('checkout-modal-backdrop').classList.add('show');
  });
  document.getElementById('checkout-modal-close').addEventListener('click', function(){
    document.getElementById('checkout-modal-backdrop').classList.remove('show');
  });

  document.getElementById('btn-pay').addEventListener('click', async function(){
    var name = document.getElementById('chk-name').value.trim();
    var email = document.getElementById('chk-email').value.trim();
    var phone = document.getElementById('chk-phone').value.trim();
    var errEl = document.getElementById('checkout-error');
    errEl.textContent = "";

    if(!shippingMethod){ errEl.textContent = "Elige cómo quieres recibir tu pedido."; return; }
    if(!name || !email){ errEl.textContent = "Escribe al menos tu nombre y correo."; return; }

    var address = null;
    if(shippingMethod !== 'pickup'){
      var street = document.getElementById('ship-street').value.trim();
      var colonia = document.getElementById('ship-colonia').value.trim();
      var city = document.getElementById('ship-city').value.trim();
      var state = document.getElementById('ship-state').value.trim();
      var zip = document.getElementById('ship-zip').value.trim();
      var ref = document.getElementById('ship-ref').value.trim();
      if(!street || !colonia || !city || !state || !zip){
        errEl.textContent = "Completa tu dirección para el envío.";
        return;
      }
      address = { street: street, colonia: colonia, city: city, state: state, zip: zip, ref: ref };
    }

    var btn = this;
    btn.disabled = true; btn.textContent = "Conectando con Mercado Pago…";

    try{
      var res = await fetch('/api/create-preference', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          items: cart.map(function(c){ return { code: c.code, qty: c.qty }; }),
          customer: { name: name, email: email, phone: phone },
          shipping: { method: shippingMethod, address: address }
        })
      });
      var data = await res.json();
      if(!res.ok){ throw new Error(data.error || 'No se pudo iniciar el pago'); }
      window.location.href = data.checkoutUrl;
    }catch(e){
      errEl.textContent = e.message || "Error de conexión. Intenta de nuevo.";
      btn.disabled = false; btn.textContent = "Pagar con Mercado Pago";
    }
  });

  function showStatusFromUrl(){
    var params = new URLSearchParams(window.location.search);
    var estado = params.get('estado');
    var el = document.getElementById('status-banner');
    if(estado === 'exito'){
      el.innerHTML = '<div class="status-banner ok">¡Pago recibido! Gracias por tu compra — te contactaremos pronto.</div>';
    }else if(estado === 'fallo'){
      el.innerHTML = '<div class="status-banner fail">El pago no se completó. Puedes intentar de nuevo.</div>';
    }else if(estado === 'pendiente'){
      el.innerHTML = '<div class="status-banner pending">Tu pago está pendiente de confirmación.</div>';
    }
  }

  // ---------- TIRA PROMOCIONAL ----------
  var ANNOUNCEMENTS = [
    '3 meses sin intereses en compras mayores a $999',
    'Envío gratis a partir de $1,190'
  ];
  var announceIdx = 0;
  function rotateAnnouncement(){
    var el = document.getElementById('announce-text');
    el.classList.add('fade');
    setTimeout(function(){
      announceIdx = (announceIdx + 1) % ANNOUNCEMENTS.length;
      el.textContent = ANNOUNCEMENTS[announceIdx];
      el.classList.remove('fade');
    }, 350);
  }
  document.getElementById('announce-text').textContent = ANNOUNCEMENTS[0];
  if(ANNOUNCEMENTS.length > 1){ setInterval(rotateAnnouncement, 3800); }

  showStatusFromUrl();
  loadProducts();

})();
</script>
</body>
</html>
